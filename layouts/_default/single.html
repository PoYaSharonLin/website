{{ define "main" }}
<div class="max-w-7xl mx-auto px-8 py-12">
  <div class="prose prose-stone dark:prose-invert max-w-none">
    <div class="mb-3">
      <h1 class="top-h1" style="font-size: 2.75em">{{- .Title -}}</h1>
      <p class="mb-1">{{ .Date.Format "January 2, 2006" }}</p>
      <p>&mdash;</p>
    </div>
    <div class="content">
      {{ .Content }}
    </div>
  </div>
  {{ partial "prevnext" . }}
</div>
{{ end }}
