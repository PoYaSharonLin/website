<script>
  let skillPanel = document.querySelector("#skill-panel")
    .previousElementSibling;
  skillPanel.addEventListener("click", function() {
    let skillBars = document.querySelectorAll(".skill-bar");
    skillBars.forEach((elem, index) => {
      setTimeout(() => {
        elem.style.width = elem.classList[0];
        elem.classList.add('animate-pulse-slow');
      }, index * 100);
    });
  });
</script>
<div class="space-y-4">
  {{ range.Site.Params.skill.list }}
  <div class="skill-item">
    <div class="flex justify-between items-center mb-2">
      <span class="font-medium text-gray-800 dark:text-gray-200">{{ .skill }}</span>
      <span class="text-sm text-gray-600 dark:text-gray-400 font-mono">{{ .skillrating }}%</span>
    </div>
    <div class="relative w-full h-3 bg-gray-200 dark:bg-dark-700 rounded-full overflow-hidden shadow-inner">
      <div class="skill-bar absolute top-0 left-0 h-full rounded-full bg-gradient-to-r from-primary-500 to-accent-500 shadow-lg" 
           style="width: 0; transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);"
           data-width="{{ .skillrating }}%">
        <div class="absolute inset-0 bg-white/20 rounded-full animate-pulse"></div>
      </div>
    </div>
  </div>
  {{ end }}
</div>
