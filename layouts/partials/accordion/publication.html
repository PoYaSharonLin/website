{{ range.Site.Params.publication.list }}
<div class="entry-item">
  <h4 class="entry-title">
    <a href="{{ .url }}" class="text-blue-700 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300">{{- .title -}}</a>
  </h4>
  {{ if .description }}
  <p class="entry-description text-slate-600 dark:text-slate-300 indent-4">
    {{ .description | markdownify }}
  </p>
  {{ end }}
</div>
{{ end }}
