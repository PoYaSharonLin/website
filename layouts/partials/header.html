<header class="border-b border-slate-200 dark:border-slate-700 mb-8">
  <nav class="max-w-7xl mx-auto py-4 flex flex-row items-center justify-between">
    <div class="flex flex-wrap gap-1">
      <a class="nav-link text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white" href="{{ .Site.BaseURL }}">Home</a>
      <a class="nav-link text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white" href="{{ `publication` | relURL }}">Publications</a>
      <a class="nav-link text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white" href="{{ `project` | relURL }}">Projects</a>
      <a class="nav-link text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white" href="{{ `files/cv.pdf` | relURL }}">CV</a>
      <a class="nav-link text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white" href="{{ `blog` | relURL }}">Blog</a>
    </div>
    <div class="flex items-center gap-3">
      <a class="text-slate-500 hover:text-slate-700 dark:hover:text-slate-300" href="{{ `search` | relURL }}">
        <i class="fas fa-search"></i>
      </a>
      <button
        class="text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 cursor-pointer"
        onclick="lightDark(this)"
        aria-label="Toggle dark mode"
      >
        <i class="fas fa-sun theme-toggle"></i>
      </button>
    </div>
  </nav>
</header>

<script>
  const lightDark = (el) => {
    let html = document.querySelector("html");
    let icon = el.querySelector("i");
    if (html.classList.contains("dark")) {
      html.classList.remove("dark");
      icon.classList.add("fa-moon");
      icon.classList.remove("fa-sun");
      window.localStorage.setItem("theme", "light");
    } else {
      html.classList.add("dark");
      icon.classList.add("fa-sun");
      icon.classList.remove("fa-moon");
      window.localStorage.setItem("theme", "dark");
    }
  };
</script>
