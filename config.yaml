  aboutme:
    title: About Me
    icon: fas fa-user
    description: |
      I am a MBA student from National Tsing Hua University, Taiwan, interested in <mark> natural language understanding </mark>, <mark> multimodal signal processing </mark>, 
      and <mark> human behavior modeling </mark> — driven by a core question: how do different signals encode meaning?
      and how can we detect whether the meaning is accurate? My research interests leads me to journeys empassing 
      semantic analysis, satellite image, and biosignal analysis. 

      I am now seeking a PhD position in Information System where I can contribute to the 
      detection of self-reporting data, 
      bringing together my background in multimodal signal processing, behavioral trace data, and 
      applied machine learning. 

