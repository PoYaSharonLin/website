        description: |
          The thesis aims to evaluate how well the search volume and the overall sentiment score of posts on a Mandarin online mobile forum would affect the prediction of sales of hybrid electric vehicles. <br><br>
          The result revealed that the electronic Word-of-mouth data does not substantially improve the sales prediction of Hybrid Electric Vehicle.
