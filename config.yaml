      - title: "Hybrid Electric Vehicle Sales Prediction using ANN, ANFIS, and E-Word-of-Mouth"
        # url: "https://drive.google.com/file/d/1kPSxWki2qHDU6GOjUp6GFk7taJx2MCSV/view?usp=sharing"
        logo: https://web.ncku.edu.tw/var/file/0/1000/img/1215/ncku-logo1.jpg
        description: |
          *Period:* 2023/07/01 to 2024/02/29 (8 months)

          *National Science and Technology Council (NSTC) Project Number:* NSTC 112-2813-C-006-026-H

          *Summary:*

          Hybrid Electric Vehicles (HEVs) dominate Taiwan's electrified vehicle market starting from 2021, 
          yet most sales forecasting research focuses on traditional statistical model and past sales data, 
          leaving a gap in understanding whether appling neural network models and <mark> online consumer signals </mark> improves the prediction accuracy in HEV demand. 
          The researchers trained both classical Artificial Neural Network (ANN) and 
          an Adaptive Neuro-Fuzzy Inference System (ANFIS) on 16 <mark> macroeconomic </mark> and 
          <mark> raw material indicators </mark>, then tested whether adding e-WOM data — 
          <mark> sentiment scores </mark> from the Mobile01 forum and <mark> Google Search Trends </mark> — 
          improved forecast accuracy, measured by MAPE. Contrary to prior literature, 
          ANFIS performed substantially worse than ANN (82% vs. 24% MAPE), 
          and incorporating e-WOM did not consistently reduce prediction error. 
          However, this may reflect the limitations of the data source 
          rather than a fundamental weakness of e-WOM itself — Mobile01, 
          while Taiwan's largest auto forum, captures only a narrow slice of 
          online consumer discourse and may skew toward enthusiasts 
          rather than the broader HEV buying public. 
          Future work incorporating a wider range of platforms — 
          such as PTT, Dcard, or social media — may yet vindicate e-WOM as a meaningful predictor of HEV sales.
  project:
