    list:
      - title: Reducing Misreporting of Health Information through Novel Positive Appeals
        url: https://drive.google.com/file/d/1dluTYVC6HBg8Wlnnb0BkMhz70wR0YQmT/view?usp=sharing
        logo: https://www.nthu.edu.tw//public/images/about10/cis-1-1.jpg
